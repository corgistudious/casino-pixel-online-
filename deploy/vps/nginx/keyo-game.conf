# Host nginx site for Keyo Game (HTTPS + WebSocket) on a shared VPS.
# Install: replace play.example.com and 18480 (KEYO_HTTP_PORT), copy to
# /etc/nginx/sites-available/keyo-game.conf, link it into sites-enabled, then
#   sudo nginx -t && sudo systemctl reload nginx
# Certificates: sudo certbot certonly --nginx -d play.example.com
# This file only adds a new server_name; it does not change other sites on the machine.

map $http_upgrade $keyo_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream keyo_game {
    server 127.0.0.1:18480;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name play.example.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # "listen ... http2" works on Ubuntu 24.04's nginx 1.24 ("http2 on;" needs 1.25.1+).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name play.example.com;

    ssl_certificate     /etc/letsencrypt/live/play.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/play.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:keyo_ssl:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 1m;

    access_log /var/log/nginx/keyo-game.access.log;
    error_log  /var/log/nginx/keyo-game.error.log warn;

    # Each location sets all its headers: nginx drops inherited proxy_set_header lines as soon as a
    # location defines one. X-Forwarded-For is overwritten (not appended) so players cannot spoof
    # their address to dodge rate limits.

    location /ws {
        proxy_pass http://keyo_game;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $keyo_connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # Game sockets stay open; the client sends traffic well within this window.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://keyo_game;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
