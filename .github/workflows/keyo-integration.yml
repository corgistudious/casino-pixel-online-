name: Keyo integration checks
on:
  pull_request:
    branches: [main, claude/keyo-cards]
  push:
    branches: [chatgpt/keyo-completion-integration]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: keyo
          POSTGRES_PASSWORD: keyo_ci_only
          POSTGRES_DB: keyo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keyo -d keyo_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://keyo:keyo_ci_only@localhost:5432/keyo_ci
      TEST_DATABASE_URL: postgres://keyo:keyo_ci_only@localhost:5432/keyo_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply all migrations on clean PostgreSQL
        run: pnpm db:migrate
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and integration tests
        run: pnpm test
      - name: Build all apps
        run: pnpm build
