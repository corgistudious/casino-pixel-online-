name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: casino
          POSTGRES_PASSWORD: casino
          POSTGRES_DB: casino_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U casino" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_URL: postgres://casino:casino@localhost:5432/casino_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The test-data reset tests take a real pg_dump backup; the runner image ships PostgreSQL 16 client tools.
      - run: pg_dump --version
      - run: pnpm typecheck
      - name: Tests (without Redis)
        run: pnpm test
      - name: Server tests with Redis fan-out
        run: pnpm --filter @casino/server test
        env:
          TEST_REDIS_URL: redis://localhost:6379
      - run: pnpm build
