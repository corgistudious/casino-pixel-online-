name: Windows desktop

# Builds the NSIS installer and a portable EXE. Set the repository variable API_URL.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web bundle
        run: pnpm --filter @casino/web build
        env:
          VITE_API_URL: ${{ vars.API_URL }}
      - name: Package with electron-builder
        run: pnpm --filter @casino/desktop dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: keyo-game-windows
          path: apps/desktop/release/*.exe
