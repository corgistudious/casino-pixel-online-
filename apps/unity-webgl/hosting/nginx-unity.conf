# Same rules for an Nginx-served staging host (Production Nginx is NOT changed by this file).
location /unity/ {
    alias /srv/unity/;
    location ~ \.wasm\.br$ { add_header Content-Encoding br; default_type application/wasm; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location ~ \.js\.br$   { add_header Content-Encoding br; default_type application/javascript; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location ~ \.data\.br$ { add_header Content-Encoding br; default_type application/octet-stream; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location = /unity/index.html { add_header Cache-Control "no-cache"; }
}
