<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Keyo Game HD Preview</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800&family=Playfair+Display:wght@700;900&display=swap">
<style>
  /* Layout: one full-window canvas (720-unit-high design, width follows the screen) + a few DOM controls. */
  :root {
    --ink: #050a19;
    --navy: #0c1834;
    --gold: #f2c14e;
    --gold-deep: #b9801c;
    --cyan: #5ad8ff;
    --fg: #f4f1ff;
    --muted: rgba(244, 241, 255, 0.62);
    --display: "Playfair Display", Georgia, serif;
    --body: "Be Vietnam Pro", system-ui, -apple-system, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--ink); color: var(--fg); font-family: var(--body); overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  #stage { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: manipulation; }
  .ctl { position: fixed; z-index: 5; display: flex; gap: 8px; }
  #menuBtn, #playBtn {
    font: 700 13px var(--body); letter-spacing: 0.02em; color: var(--fg); border: 1px solid rgba(242, 193, 78, 0.45);
    background: rgba(8, 14, 34, 0.82); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-radius: 999px; padding: 9px 14px; cursor: pointer; box-shadow: 0 6px 18px -8px rgba(0,0,0,0.8);
  }
  #playBtn { color: #1d1405; background: linear-gradient(135deg, #fff1b8, #f2c14e 50%, #d29a2c); border-color: transparent; }
  #menuBtn:focus-visible, #playBtn:focus-visible, .sheet button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .bl { bottom: calc(10px + env(safe-area-inset-bottom, 0px)); left: calc(12px + env(safe-area-inset-left, 0px)); }
  .sheet {
    position: fixed; z-index: 6; bottom: calc(58px + env(safe-area-inset-bottom, 0px)); left: calc(12px + env(safe-area-inset-left, 0px));
    width: min(300px, calc(100vw - 20px)); max-height: calc(100% - 70px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); overflow-y: auto;
    background: rgba(9, 16, 38, 0.95); border: 1px solid rgba(242, 193, 78, 0.3); border-radius: 18px; padding: 12px;
    box-shadow: 0 24px 50px -18px rgba(0,0,0,0.9); display: grid; gap: 10px;
  }
  .sheet h2 { margin: 0; font: 700 11px var(--body); letter-spacing: 0.14em; text-transform: uppercase; color: var(--cyan); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .sheet button { font: 600 13px var(--body); color: var(--fg); background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 9px 8px; text-align: left; cursor: pointer; }
  .sheet button[aria-pressed="true"] { border-color: var(--gold); background: rgba(242,193,78,0.14); color: #fff1b8; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .seg button { text-align: center; }
  .note { margin: 0; font-size: 11.5px; line-height: 1.45; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { #menuBtn, #playBtn { transition: none; } }
</style>

</head><body><canvas id="stage" aria-label="Keyo Game HD visual preview"></canvas>
<div class="ctl bl"><button id="menuBtn" type="button" aria-expanded="false" aria-controls="sheet">☰ Màn hình</button><button id="playBtn" type="button">▶ Animation</button></div>
<div id="sheet" class="sheet" hidden>
  <h2>Màn hình</h2>
  <div class="grid" id="sceneList"></div>
  <h2>Chất lượng đồ họa</h2>
  <div class="seg" id="qualityList"></div>
  <p class="note">Bản xem trước đồ họa HD dựng bằng Canvas 2D trên trình duyệt. Toàn bộ là dữ liệu giả lập: không kết nối máy chủ, không tài khoản, không giao dịch. Đây chưa phải bản Unity.</p>
</div>

  scenes.xito = { title: 'Xì Tố', dur: 6.5, draw(t) { ringTable(this.title, t, 5, HANDS5, { room: '#10284a', felt: ['#1f8a5a', '#0f5a39', '#062a1b'], dur: this.dur, faceUp: (i, c, tt) => i === 0 || c > 0 || tt > 5.2, win: (i, tt) => i === 0 && tt > 5.6, winText: 'Corgi Royale thắng · Cù lũ', actions: ['Tố', 'Theo', 'Úp bỏ'] }); } };

  // Slots -------------------------------------------------------------------------------
  const SYMS = ['seven', 'gem', 'crown', 'coin', 'bell', 'logo'];
  function slotSymbol(x, y, s, idx) {
    const k = SYMS[((idx % SYMS.length) + SYMS.length) % SYMS.length];
    ctx.save(); ctx.translate(x, y);
    if (k === 'seven') text('7', 0, 2, s * 0.95, goldGrad(-s / 2, s / 2), { align: 'center', font: FONT.d, weight: 900, shadow: 'rgba(200,32,60,0.8)', blur: 10 });
    else if (k === 'gem') { const g = ctx.createLinearGradient(0, -s / 2, 0, s / 2); g.addColorStop(0, '#9ff3ff'); g.addColorStop(1, '#1f6fd0'); ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, -s * 0.42); ctx.lineTo(s * 0.38, -s * 0.1); ctx.lineTo(0, s * 0.42); ctx.lineTo(-s * 0.38, -s * 0.1); ctx.closePath(); ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 2; ctx.stroke(); }
    else if (k === 'crown') { ctx.fillStyle = goldGrad(-s / 2, s / 2); ctx.beginPath(); ctx.moveTo(-s * 0.4, s * 0.25); ctx.lineTo(-s * 0.42, -s * 0.2); ctx.lineTo(-s * 0.18, s * 0.02); ctx.lineTo(0, -s * 0.36); ctx.lineTo(s * 0.18, s * 0.02); ctx.lineTo(s * 0.42, -s * 0.2); ctx.lineTo(s * 0.4, s * 0.25); ctx.closePath(); ctx.fill(); ctx.fillStyle = '#c8203c'; ctx.beginPath(); ctx.arc(0, s * 0.12, s * 0.07, 0, TAU); ctx.fill(); }
    else if (k === 'coin') coin('gold', 0, 0, s * 0.82);
    else if (k === 'bell') { ctx.fillStyle = goldGrad(-s / 2, s / 2); ctx.beginPath(); ctx.moveTo(-s * 0.32, s * 0.24); ctx.quadraticCurveTo(-s * 0.3, -s * 0.36, 0, -s * 0.36); ctx.quadraticCurveTo(s * 0.3, -s * 0.36, s * 0.32, s * 0.24); ctx.closePath(); ctx.fill(); ctx.beginPath(); ctx.arc(0, s * 0.3, s * 0.08, 0, TAU); ctx.fill(); }
    else if (k === 'logo') { const i = IMG.logo; if (i && i.complete) { const w = s * 0.95; ctx.drawImage(i, -w / 2, -w * i.height / i.width / 2, w, w * i.height / i.width); } }
    ctx.restore();
  }
  scenes.slots = {
    title: 'Keyo Slots', dur: 4.6,
    final: [[0, 2, 3], [0, 1, 4], [0, 3, 5], [2, 0, 1], [4, 5, 0]],
    draw(t) {
      room('#3a1240', '#0a030f');
      const cols = 5, cell = 120, mw = cols * cell + 60, mx = VW / 2 - mw / 2, my = 120, mh = 3 * cell + 60;
      ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 40; rr(mx, my, mw, mh, 34); ctx.fillStyle = '#1a0a24'; ctx.fill(); ctx.restore();
      rr(mx, my, mw, mh, 34); ctx.strokeStyle = goldGrad(my, my + mh); ctx.lineWidth = 6; ctx.stroke();
      const logo = IMG.logo; if (logo && logo.complete) { const lw = 140; ctx.drawImage(logo, VW / 2 - lw / 2, my - 96, lw, lw * logo.height / logo.width); }
      for (let c = 0; c < cols; c++) {
        const x = mx + 30 + c * cell, y = my + 30;
        ctx.save(); rr(x + 4, y, cell - 8, cell * 3, 16); const g = ctx.createLinearGradient(0, y, 0, y + cell * 3); g.addColorStop(0, '#2b1240'); g.addColorStop(0.5, '#f6efe4'); g.addColorStop(1, '#2b1240'); ctx.fillStyle = '#f3ece0'; ctx.fill(); ctx.clip();
        const stopAt = 1.4 + c * 0.45, k = seg(t, 0.2, stopAt - 0.2), spinning = t < stopAt;
        const off = spinning ? (t * 22 + c * 3) % 1 : 0, base = spinning ? Math.floor(t * 22 + c * 7) : 0;
        for (let r = -1; r < 4; r++) {
          const idx = spinning ? base + r : this.final[c][r] ?? 0;
          const yy = y + (r + off) * cell + cell / 2 + (spinning ? 0 : Math.sin(seg(t, stopAt, 0.25) * Math.PI) * -10);
          if (QUALITY[quality].fx && spinning) ctx.globalAlpha = 0.75;
          slotSymbol(x + cell / 2, yy, cell * 0.66, idx); ctx.globalAlpha = 1;
        }
        const sh = ctx.createLinearGradient(0, y, 0, y + cell * 3); sh.addColorStop(0, 'rgba(0,0,0,0.45)'); sh.addColorStop(0.2, 'rgba(0,0,0,0)'); sh.addColorStop(0.8, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(0,0,0,0.45)'); ctx.fillStyle = sh; ctx.fillRect(x, y, cell, cell * 3);
        ctx.restore();
        void k;
      }
      const win = t > 3.4;
      if (win) { ctx.strokeStyle = '#f2c14e'; ctx.lineWidth = 5; ctx.shadowColor = '#f2c14e'; ctx.shadowBlur = 18; ctx.beginPath(); ctx.moveTo(mx + 40, my + 30 + cell * 0.5); ctx.lineTo(mx + mw - 40, my + 30 + cell * 0.5); ctx.stroke(); ctx.shadowBlur = 0; }
      if (win && QUALITY[quality].fx) { const r = rngFrom(11); for (let i = 0; i < 26; i++) { const k = seg(t, 3.4 + r() * 0.3, 1.1); const a = -Math.PI / 2 + (r() - 0.5) * 2.4, sp = 260 + r() * 260; coin('gold', VW / 2 + Math.cos(a) * sp * k, my + mh / 2 + Math.sin(a) * sp * k + 380 * k * k, 34); } }
      const by = my + mh + 22;
      plate(VW / 2 - 330, by, 200, 52); text('Cược', VW / 2 - 300, by + 27, 14, 'rgba(244,241,255,0.6)', { weight: 700 }); coin('silver', VW / 2 - 236, by + 26, 22); text('1.000', VW / 2 - 220, by + 27, 19, '#fff', { weight: 800 });
      plate(VW / 2 + 130, by, 200, 52); text('Thắng', VW / 2 + 158, by + 27, 14, 'rgba(244,241,255,0.6)', { weight: 700 }); text(win ? '+25.000' : '—', VW / 2 + 230, by + 27, 19, win ? '#f2c14e' : '#fff', { weight: 800 });
      button(VW / 2 - 110, by - 2, 220, 56, t < 3.4 ? 'Đang quay…' : 'QUAY');
      topBar(this.title);
    },
  };

  // ---------- engine ----------
  const ORDER = [['lobby', 'Sảnh Game Center'], ['poker', 'Poker'], ['blackjack', 'Blackjack'], ['roulette', 'Roulette'], ['taixiu', 'Tài Xỉu'], ['lieng', 'Liêng'], ['xito', 'Xì Tố'], ['slots', 'Slots']];
  let current = 'lobby', startedAt = performance.now(), raf = 0, dirty = true;
  function go(id) {
    if (!scenes[id]) id = 'lobby';
    current = id; startedAt = performance.now();
    if (location.hash !== '#' + id) history.replaceState(null, '', '#' + id);
    document.querySelectorAll('#sceneList button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.id === id)));
    invalidate();
  }
  function invalidate() { dirty = true; if (!raf) raf = requestAnimationFrame(frame); }
  function frame(now) {
    raf = 0;
    const sc = scenes[current];
    let t = (now - startedAt) / 1000;
    if (reduceMotion) t = sc.dur + 1;
    const animating = t < sc.dur + 0.1 || (sc.ambient && QUALITY[quality].fx >= 2 && !reduceMotion);
    if (!dirty && !animating) return;
    dirty = false;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#050a19'; ctx.fillRect(0, 0, W, H);
    ctx.setTransform(DPR * S, 0, 0, DPR * S, DPR * OX, DPR * OY);
    hits = [];
    sc.draw(Math.min(t, sc.dur + 0.1), now);
    if (W < H) { ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.fillStyle = 'rgba(5,10,25,0.72)'; ctx.fillRect(0, H - 54, W, 54); ctx.font = `700 14px ${FONT.b}`; ctx.fillStyle = '#5ad8ff'; ctx.textAlign = 'center'; ctx.fillText('Xoay ngang điện thoại để xem đúng tỉ lệ', W / 2, H - 26); }
    if (animating) raf = requestAnimationFrame(frame);
  }
  canvas.addEventListener('click', (e) => {
    const x = (e.clientX - OX) / S, y = (e.clientY - OY) / S;
    for (let i = hits.length - 1; i >= 0; i--) { const h = hits[i]; if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) { go(h.go); return; } }
  });

  // DOM controls
  const sheet = document.getElementById('sheet'), menuBtn = document.getElementById('menuBtn');
  const list = document.getElementById('sceneList'), qlist = document.getElementById('qualityList');
  for (const [id, label] of ORDER) { const b = document.createElement('button'); b.type = 'button'; b.dataset.id = id; b.textContent = label; b.addEventListener('click', () => { go(id); sheet.hidden = true; menuBtn.setAttribute('aria-expanded', 'false'); }); list.appendChild(b); }
  for (const id of Object.keys(QUALITY)) { const b = document.createElement('button'); b.type = 'button'; b.dataset.q = id; b.textContent = QUALITY[id].label; b.setAttribute('aria-pressed', String(id === quality)); b.addEventListener('click', () => { quality = id; try { localStorage.setItem('keyo.hd.q', id); } catch (e) {} qlist.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.q === id))); resize(); }); qlist.appendChild(b); }
  menuBtn.addEventListener('click', () => { sheet.hidden = !sheet.hidden; menuBtn.setAttribute('aria-expanded', String(!sheet.hidden)); });
  document.getElementById('playBtn').addEventListener('click', () => { startedAt = performance.now(); invalidate(); });
  addEventListener('resize', resize);
  addEventListener('orientationchange', () => setTimeout(resize, 250));
  addEventListener('hashchange', () => go(location.hash.slice(1)));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) resize(); });
  resize();
  go(location.hash.slice(1) || 'lobby');
  if (document.fonts && document.fonts.load) Promise.all([document.fonts.load('900 20px "Playfair Display"'), document.fonts.load('700 20px "Be Vietnam Pro"')]).then(() => invalidate(), () => {});
})();
</script>
